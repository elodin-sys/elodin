[package]
name = "mekf"
license = "MIT OR Apache-2.0"
edition = "2024"
version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# async
stellarator.path = "../../libs/stellarator"
stellarator.features = ["miette"]
impeller-stellar.path = "../../libs/impeller/stellar"

# ser-de
impeller.path = "../../libs/impeller"
impeller.features = ["std"]
impeller-wkt.path = "../../libs/impeller/wkt"
impeller-wkt.features = ["gui", "std"]
zerocopy.version = "0.8.2"
db-macros.workspace = true
roci-adcs.path = "../roci/adcs"



anyhow = "1"

# math
nox.path = "../../libs/nox"

# rand
fastrand = "2.2.0"

# config
clap.version = "4.4.18"
clap.features = ["derive"]
mlua.version = "0.10.5"
mlua.features = ["lua54", "serialize", "vendored", "async", "anyhow"]
serde.version = "1.0"
serde.features = ["derive"]

# mag calc
wmm.workspace = true
