[package]
name = "betaflight-sitl-controller"
license = "MIT OR Apache-2.0"
edition = "2024"
version.workspace = true
repository.workspace = true
description = "Safe manual input provider for the Betaflight SITL example"
publish = false

[package.metadata.dist]
dist = false

[[bin]]
name = "betaflight-sitl-controller"
path = "src/main.rs"

[dependencies]
impeller = { path = "../../../libs/impeller", features = ["std"] }
impeller-stellar = { path = "../../../libs/impeller/stellar" }
impeller-wkt = { path = "../../../libs/impeller/wkt" }
stellarator = { path = "../../../libs/stellarator", features = ["tokio"] }
gilrs = "0.11"
device_query = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
