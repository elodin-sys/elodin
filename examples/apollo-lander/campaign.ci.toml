timeout = "180s"
retries = 0
continue_on_error = true

[[build]]
command = "cargo"
args = ["build", "--release", "--manifest-path", "examples/apollo-lander/controller/Cargo.toml"]

[resources]
db_port = "auto"

[resources.ports]
state = "auto"
command = "auto"

[retention]
keep_run_db = "on-fail"

[hooks]
post_run = "examples/apollo-lander/hooks/ci_score.py"
post_campaign = "examples/apollo-lander/hooks/ci_gate.py"
