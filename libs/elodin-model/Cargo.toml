[package]
name = "elodin-model"
license = "MIT OR Apache-2.0"
version.workspace = true
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
cranelift-mlir.path = "../cranelift-mlir"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1"
