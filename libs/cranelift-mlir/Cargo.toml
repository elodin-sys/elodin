[package]
name = "cranelift-mlir"
license = "MIT OR Apache-2.0"
version.workspace = true
edition = "2024"
publish = false

[features]
default = ["jit"]
# Cranelift JIT + native ISA. Off for wasm32-unknown-unknown: display
# kernels interpret the same StableHLO IR instead of emitting code.
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:faer",
    "dep:rayon",
]
# Opt-in Tracy zone emission for cranelift-mlir's live profiling layer.
# Orthogonal to `ELODIN_CRANELIFT_DEBUG_DIR`: zones only emit when both
# the feature is built and the env var is set. See PERFORMANCE.md for
# the `nix develop .#tracy && just install tracy` workflow.
tracy = ["dep:tracy-client"]

[dependencies]
cranelift-codegen = { version = "0.130", optional = true }
cranelift-frontend = { version = "0.130", optional = true }
cranelift-jit = { version = "0.130", optional = true }
cranelift-module = { version = "0.130", optional = true }
cranelift-native = { version = "0.130", optional = true }
winnow = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
faer = { version = "0.20", default-features = false, features = ["std", "svd", "qr", "evd", "cholesky", "lu"], optional = true }
wide = "1.3"
rayon = { version = "1.11", optional = true }
# =0.18.4 pulls tracy-client-sys 0.28 (Tracy 0.13). 0.18.5 is Tracy 0.14,
# which nixpkgs tracy-capture cannot read.
tracy-client = { version = "=0.18.4", optional = true }
blake3 = "1.8.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
memmap2 = "0.9.10"

[dev-dependencies]
bytemuck = "1.21"
