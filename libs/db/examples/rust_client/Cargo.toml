[package]
name = "elodin-db-rust-client"
version = "0.1.0"
edition = "2024"
authors = ["dan@elodin.systems"]

# Exclude this example from cargo-dist distribution
[package.metadata.dist]
dist = false

[[bin]]
name = "rust_client"
path = "src/main.rs"

[dependencies]
# Core protocol
impeller = { path = "../../../impeller", features = ["std"] }
impeller-stellar = { path = "../../../impeller/stellar" }
impeller-wkt = { path = "../../../impeller/wkt" }

# Async runtime
stellarator = { path = "../../../stellarator", features = ["tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
postcard = "1.1"
zerocopy = "0.8"

# Error handling
anyhow = "1"

# CLI and display
clap = { version = "4", features = ["derive"] }
colored = "2"

# TUI with IOCraft. Macros 0.2.5 emit `RequiredPropSet`, which iocraft 0.7.18
# does not export, so keep the macro crate on the last compatible release.
iocraft = "0.7"
iocraft-macros = "=0.2.4"
smol = "2"
async-channel = "2"
futures-lite = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
