[package]
name = "eql"
version.workspace = true
edition = "2024"

[dependencies]
# parse
peg = "0.8.5"
unicode-ident = "1.0.18"
convert_case = "0.8.0"

# data-structures
smallvec = "1.15"
impeller2.path = "../../impeller2"
impeller2-wkt.path = "../../impeller2/wkt"

# errors
thiserror = "1"

# time
hifitime = "4"
jiff = "0.2"

# geo-frame math for ecef_to_ned() / friends (SQL emission; no Bevy ECS)
bevy_geo_frames = { path = "../../bevy_geo_frames", default-features = false }
bevy_math = { workspace = true }
