syntax = "proto3";

package elodin.db.v1;

// All `*_ns` fields are nanoseconds. Record time is stored at microsecond
// resolution: write timestamps are floored to the containing microsecond and
// query ranges are evaluated half-open on that microsecond grid.

enum PrimType {
  PRIM_TYPE_UNSPECIFIED = 0;
  PRIM_TYPE_U8 = 1;
  PRIM_TYPE_U16 = 2;
  PRIM_TYPE_U32 = 3;
  PRIM_TYPE_U64 = 4;
  PRIM_TYPE_I8 = 5;
  PRIM_TYPE_I16 = 6;
  PRIM_TYPE_I32 = 7;
  PRIM_TYPE_I64 = 8;
  PRIM_TYPE_BOOL = 9;
  PRIM_TYPE_F32 = 10;
  PRIM_TYPE_F64 = 11;
}

message ComponentValue {
  uint32 component_index = 1;

  oneof value {
    double f64 = 2;
    float f32 = 3;
    sint64 i64 = 4;
    uint64 u64 = 5;
    bool b = 6;
    DoubleArray f64s = 7;
    FloatArray f32s = 8;
    Sint64Array i64s = 9;
    Uint64Array u64s = 10;
    BoolArray bools = 11;
  }
}

message DoubleArray {
  repeated double v = 1;
}

message FloatArray {
  repeated float v = 1;
}

message Sint64Array {
  repeated sint64 v = 1;
}

message Uint64Array {
  repeated uint64 v = 1;
}

message BoolArray {
  repeated bool v = 1;
}

message AckPolicy {
  uint32 max_unacked_rows = 1; // 0 → 256
  uint32 max_ack_delay_ms = 2; // 0 → 100
}

// Cumulative acknowledgement: every row with sequence <= through_seq has been
// applied to the database and is visible to readers. Durability follows the
// server's storage flush policy. The resume position is persisted at ack
// cadence, so after a server crash the stream resumes at the last
// acknowledged sequence and replays unacknowledged rows (at-least-once).
message WriteAck {
  uint64 through_seq = 1;
}

message DbConfig {
  bool recording = 1;
  uint64 default_stream_time_step_ns = 2;
  map<string, string> metadata = 3;
}

message ComponentMetadata {
  string name = 1;
  map<string, string> metadata = 2;
}

message MessageMetadata {
  string name = 1;
  bytes postcard_schema = 2;
  map<string, string> metadata = 3;
}

message ComponentSchemaSnapshot {
  string name = 1;
  PrimType prim_type = 2;
  repeated uint64 dims = 3;
  sfixed64 start_time_ns = 4;
}
