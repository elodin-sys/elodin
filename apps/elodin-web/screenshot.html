<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Empty content shows the connect screen. `ELODIN_WEB_DB` fills this at build time. -->
    <meta name="elodin-web-db" content="" />
    <title>Elodin screenshot</title>
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0b;
        color: #ddd;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        background: #161616;
      }
      button {
        font: inherit;
        padding: 6px 12px;
      }
      #status {
        color: #e94b14;
      }
      #strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 0 12px 8px;
        background: #161616;
      }
      #strip:empty {
        display: none;
      }
      #strip img {
        height: 72px;
        display: block;
        border: 1px solid #333;
        background: #000;
      }
      #stage {
        flex: 1;
        min-height: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="capture" type="button" disabled>Capture screenshot</button>
      <span id="status"></span>
    </div>
    <div id="strip"></div>
    <div id="stage">
      <canvas id="editor"></canvas>
    </div>
    <script>
      const button = document.getElementById("capture");
      const status = document.getElementById("status");
      const strip = document.getElementById("strip");
      window.addEventListener("elodin-ready", () => {
        button.disabled = false;
      });
      button.addEventListener("click", async () => {
        button.disabled = true;
        status.textContent = "";
        try {
          const blob = await elodin.captureScreenshot();
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          const img = new Image();
          img.src = url;
          img.alt = "Editor screenshot";
          img.title = `${blob.size} bytes`;
          link.append(img);
          strip.prepend(link);
        } catch (err) {
          status.textContent = err instanceof Error ? err.message : String(err);
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
