[build]
target = "index.html"
dist = "dist"
# Local iteration. `just web-release` overrides this with wasm-release.
# The dev profile is ~500MB and never finishes compiling in the browser.
cargo_profile = "wasm-dev"

[watch]
watch = [
  ".",
  "../../libs/elodin-editor",
  "../../libs/impeller",
  "../../libs/webcodecs-video",
]

[serve]
port = 8080
addresses = ["127.0.0.1"]
no_autoreload = true
