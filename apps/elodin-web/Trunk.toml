[build]
target = "index.html"
dist = "dist"
# Debug wasm is ~500MB and never finishes compiling in the browser.
cargo_profile = "wasm-release"

[watch]
watch = [
  ".",
  "../../libs/elodin-editor",
  "../../libs/impeller",
  "../../libs/webcodecs-video",
]

[serve]
port = 8080
addresses = ["127.0.0.1"]
no_autoreload = true

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", """
# Portable in-place edit: BSD sed (macOS) requires a backup suffix; GNU sed
# accepts `-i.bak` too. Matches scripts/test-quickstart.sh.
[ -z "$ELODIN_WEB_DB" ] || {
  sed -i.bak "s|name=\\"elodin-web-db\\" content=\\"\\"|name=\\"elodin-web-db\\" content=\\"$ELODIN_WEB_DB\\"|" "$TRUNK_STAGING_DIR/index.html"
  rm -f "$TRUNK_STAGING_DIR/index.html.bak"
}
"""]
