{% macro javascript() %}
<script type="text/javascript" src="{{ get_url(path="js/main.js") | safe }}"></script>
<script>
    // https://mathjax.github.io/MathJax-demos-web/convert-configuration/convert-configuration.html
    window.MathJax = {
        tex: {
            inlineMath: [
                ["$", "$"],
                ["\\(", "\\)"],
            ],
            displayMath: [
                ["$$", "$$"],
                ["\[\[", "\]\]"],
            ],
            processEscapes: true,
            processEnvironments: true,
        },
        options: {
            skipHtmlTags: ["script", "noscript", "style", "textarea", "pre"],
        },
    };
</script>
<script type="text/javascript" src="{{ get_url(path="js/tex-mml-chtml.js") | safe }}"></script>
<script type="module">
    // Zola < 0.22 emits class="language-mermaid"; 0.22+ (giallo) emits data-lang="mermaid".
    const blocks = document.querySelectorAll('pre > code.language-mermaid, pre > code[data-lang="mermaid"]');
    if (blocks.length) {
        const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
        mermaid.initialize({
            startOnLoad: false,
            theme: document.body.classList.contains("dark") ? "dark" : "default",
            securityLevel: "loose",
        });
        const nodes = [...blocks].map((code) => {
            const div = document.createElement("div");
            div.className = "mermaid";
            div.style.margin = "2rem 0";
            div.style.overflowX = "auto";
            div.style.textAlign = "center";
            div.textContent = code.textContent;
            code.parentElement.replaceWith(div);
            return div;
        });
        await mermaid.run({ nodes });
    }
</script>
{% if config.build_search_index %}
  <script type="text/javascript" src="{{ get_url(path="js/elasticlunr.min.js") | safe }}"></script>
  <script type="text/javascript" src="{{ get_url(path="search_index." ~ lang ~ ".js") | safe }}"></script>
  <script type="text/javascript" src="{{ get_url(path="js/search.js") | safe }}"></script>
{% endif %}
{% endmacro %}
